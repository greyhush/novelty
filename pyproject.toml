[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "novelty"
version = "0.1.0"
description = "Open-world text adventure game - player writes the story, LLM generates the world in real-time"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "greyhush"}
]
keywords = ["game", "interactive-fiction", "llm", "text-adventure", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
novelty = "novelty.cli:main"

[tool.setuptools.packages.find]
include = ["novelty*"]
